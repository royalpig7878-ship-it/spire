<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale=1 + user-scalable=no stops the browser's own pinch-zoom
       so our game can handle zooming itself. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SPIRE</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#22346e" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SPIRE" />
  <style>
    :root {
      /* Text size multiplier; a settings screen will change this in M8. */
      --text-scale: 1;
      --bar-bg: #1d2733;
      --bar-border: #33414f;
      --chip-bg: #2b3a4a;
      --accent: #ffd166;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* touch-action is NOT inherited, so the canvas needs its own. This
         stops the browser's native pinch-zoom/scroll on the game view. */
      touch-action: none;
    }

    /* ---- UI layer on top of the canvas ---- */
    #ui-root {
      position: fixed;
      inset: 0;
      pointer-events: none; /* let touches fall through to the canvas... */
      font: 600 calc(14px * var(--text-scale)) system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #fff;
    }
    #ui-root .hud, #ui-root .toolbar, #ui-root .toast { pointer-events: none; }
    #ui-root .pill, #ui-root .toolbar { pointer-events: auto; } /* ...except on real controls */

    .hud {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .pill {
      background: rgba(29, 39, 51, 0.88);
      border-radius: 22px;
      padding: 10px 16px;
      min-height: 24px;
      line-height: 24px;
      font-size: calc(16px * var(--text-scale));
    }
    #hud-funds { color: var(--accent); border: 0; font-weight: inherit; }
    .hbars { display: flex; gap: 6px; align-items: flex-end; padding: 4px 0 8px; }
    .hbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-height: 80px; }
    .hbar small { font-size: calc(10.5px * var(--text-scale)); color: #9fb0c0; line-height: 1.1; }
    .hbar .fill { display: block; width: 100%; border-radius: 4px 4px 0 0; }
    .fill.pos { background: #4fa36a; }
    .fill.neg { background: #d9534f; }
    .pos { color: #7be0a0; }
    .neg { color: #ff9a9a; }
    /* In debt: red AND a "!" badge, so it never relies on color alone. */
    #hud-funds.debt { color: #ff8a8a; }
    #hud-funds.debt::before {
      content: '!';
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      margin-right: 6px;
      border-radius: 50%;
      background: #d64545;
      color: #fff;
      text-align: center;
      font-size: 14px;
    }
    .icon-btn {
      width: 48px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
    }
    .hud2 { top: calc(max(8px, env(safe-area-inset-top)) + 56px); align-items: center; }
    .hud3 { top: calc(max(8px, env(safe-area-inset-top)) + 116px); justify-content: flex-start; }
    .pill.small { font-size: calc(13px * var(--text-scale)); padding: 4px 12px; min-height: 0; }
    #hud-mood.low { color: #ff8a8a; }
    #hud-mood.low::before {
      content: '!';
      display: inline-block;
      width: 16px;
      height: 16px;
      line-height: 16px;
      margin-right: 6px;
      border-radius: 50%;
      background: #d64545;
      color: #fff;
      text-align: center;
      font-size: 12px;
    }
    #hud-clock { font-size: calc(14px * var(--text-scale)); padding: 6px 14px; display: flex; flex-direction: column; line-height: 1.25; }
    #hud-clock small { font-size: calc(11px * var(--text-scale)); font-weight: 500; color: #b8c4d0; }
    .tier-btn { color: var(--accent); border: 2px solid transparent; letter-spacing: 1px; }
    .tier-btn:active { border-color: var(--accent); }
    .speeds {
      display: flex;
      gap: 4px;
      background: rgba(29, 39, 51, 0.88);
      border-radius: 24px;
      padding: 3px;
      pointer-events: auto;
    }
    .speed-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 22px;
      background: transparent;
      display: grid;
      place-items: center;
      padding: 0 6px;
    }
    .speed-btn.active { background: var(--accent); color: #1d2733; }
    .debt-banner {
      position: absolute;
      top: calc(max(8px, env(safe-area-inset-top)) + 160px);
      left: 50%;
      transform: translateX(-50%);
      background: #d64545;
      border-radius: 18px;
      padding: 8px 16px;
      display: none;
      white-space: nowrap;
      font-size: calc(13px * var(--text-scale));
    }
    .debt-banner.show { display: block; }

    /* ---- Overlay button + legend ---- */
    .overlay-btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 14px;
      border: 2px solid transparent;
    }
    .overlay-btn.active { border-color: var(--accent); color: var(--accent); }
    .hud3 { align-items: center; }
    .layer-menu {
      position: absolute;
      top: calc(max(8px, env(safe-area-inset-top)) + 168px);
      right: 8px;
      display: grid;
      gap: 4px;
      background: rgba(29, 39, 51, 0.97);
      border: 1px solid var(--bar-border);
      border-radius: 16px;
      padding: 6px;
      pointer-events: auto;
      min-width: 180px;
    }
    .layer-menu[hidden] { display: none; }
    .layer-option { min-height: 44px; border-radius: 12px; background: transparent; text-align: left; padding: 0 14px; }
    .layer-option:active { background: var(--chip-bg); }
    .power-banner { top: calc(max(8px, env(safe-area-inset-top)) + 198px); background: #b8741a; }
    .legend {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: calc(var(--toolbar-h, 200px) + 8px);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(29, 39, 51, 0.92);
      border-radius: 18px;
      padding: 6px 12px;
      font-size: calc(12px * var(--text-scale));
      pointer-events: none;
    }
    .legend.show { display: flex; }
    .sheet:not([hidden]) ~ .legend { display: none; }
    .legend .ramp { flex: 1; height: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); }
    .legend span { white-space: nowrap; }

    /* ---- Info sheet (long-press a building) ---- */
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 64vh;
      overflow-y: auto;
      background: var(--bar-bg);
      border-top: 1px solid var(--bar-border);
      border-radius: 20px 20px 0 0;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
      touch-action: pan-y;
    }
    .sheet[hidden] { display: none; }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .sheet-head h3 { margin: 0; font-size: calc(18px * var(--text-scale)); display: inline; }
    .tag { margin-left: 8px; color: #9fb0c0; font-weight: 500; }
    .close { width: 44px; height: 44px; border-radius: 22px; background: var(--chip-bg); font-size: 24px; line-height: 1; padding: 0; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-weight: 500; }
    .kv span:first-child { color: #b8c4d0; }
    .warn { color: #ffb4a8; }
    .note { margin: 0 0 8px; color: #b8c4d0; font-weight: 500; line-height: 1.35; font-size: calc(13px * var(--text-scale)); }
    .section-label { margin: 12px 0 6px; font-size: calc(12px * var(--text-scale)); color: #9fb0c0; text-transform: uppercase; letter-spacing: 0.04em; }
    .tenant-row { display: grid; grid-template-columns: 14px 86px 1fr 28px; align-items: center; gap: 8px; padding: 3px 0; font-weight: 500; font-size: calc(13px * var(--text-scale)); }
    .tenant-row .dot { width: 12px; height: 12px; border-radius: 50%; }
    .tenant-row .bar { height: 8px; border-radius: 4px; background: #2b3a4a; overflow: hidden; }
    .tenant-row .bar span { display: block; height: 100%; background: linear-gradient(90deg, #f7b267, #8e1d4c); }
    .tenant-row .num { text-align: right; }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .step { width: 52px; height: 48px; border-radius: 14px; background: var(--chip-bg); font-size: 26px; padding: 0; }
    .step:disabled { opacity: 0.4; }
    .step-value { flex: 1; text-align: center; display: flex; flex-direction: column; }
    .step-value small { color: #9fb0c0; font-weight: 500; }
    .car-list { margin-top: 6px; }
    .car-row { color: #b8c4d0; font-weight: 500; font-size: calc(12px * var(--text-scale)); padding: 2px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { min-width: 52px; min-height: 48px; border-radius: 12px; background: var(--chip-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 2px 6px; }
    .chip small { font-size: 10px; font-weight: 500; color: #b8c4d0; }
    .chip.on { border-color: var(--accent); }
    .chip.off { background: transparent; border: 2px dashed #5b6b7b; color: #9fb0c0; }
    .chip.off b { text-decoration: line-through; }
    .chip.locked { opacity: 0.45; border-style: dotted; }
    .chip.forced { opacity: 0.8; }
    .chip:disabled { cursor: default; }

    /* ---- Pop-up cards ---- */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: grid;
      place-items: center;
      padding: 16px;
      pointer-events: auto;
    }
    .card {
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      border-radius: 20px;
      padding: 18px;
      width: 100%;
      max-width: 340px;
      max-height: 86vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: calc(19px * var(--text-scale));
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card p { margin: 0 0 12px; font-weight: 500; color: #c8d2dc; line-height: 1.4; }
    .section-label { font-size: calc(12px * var(--text-scale)); color: #9fb0c0; margin-bottom: 4px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; font-weight: 500; }
    .row.total { border-top: 1px solid var(--bar-border); margin-top: 4px; font-weight: 700; }
    .row.muted { color: #9fb0c0; }
    .muted-inline { color: #9fb0c0; font-size: 0.85em; margin-left: 6px; }
    .net {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: #26384a;
      font-size: calc(18px * var(--text-scale));
      font-weight: 700;
    }
    .net.gain .net-value { color: #7be0a0; }
    .net.loss .net-value { color: #ff9a9a; }
    .coin { animation: coin-pop 0.7s ease-out; }
    @keyframes coin-pop {
      0% { transform: translateY(8px) scale(0.5) rotateY(0); opacity: 0; }
      60% { transform: translateY(-6px) scale(1.15) rotateY(360deg); opacity: 1; }
      100% { transform: none; }
    }
    .primary, .secondary, .choice {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      padding: 0 16px;
      margin-top: 8px;
      box-sizing: border-box;
    }
    .primary { background: var(--accent); color: #1d2733; justify-content: center; font-weight: 700; }
    .secondary { background: transparent; border-color: var(--bar-border); justify-content: center; }
    .choice { background: var(--chip-bg); }
    .choice:disabled { opacity: 0.45; }
    .card { position: relative; }
    .setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; font-weight: 500; }
    .setting input[type='range'] { flex: 1; max-width: 160px; height: 44px; accent-color: var(--accent); }
    .seg { display: flex; gap: 4px; background: #14202c; border-radius: 12px; padding: 3px; }
    .seg button { min-height: 44px; min-width: 52px; padding: 0 10px; border-radius: 10px; background: transparent; font-size: calc(13px * var(--text-scale)); }
    .seg button.on { background: var(--accent); color: #1d2733; font-weight: 700; }

    /* ---- Title screen, scenarios, goals (M9) ---- */
    .title-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: linear-gradient(180deg, rgba(14, 22, 38, 0.82), rgba(14, 22, 38, 0.94));
      pointer-events: auto;
      z-index: 20;
      overflow-y: auto;
    }
    .title-screen[hidden] { display: none; }
    .title-card { width: 100%; max-width: 360px; }
    .title-card.wide { max-width: 420px; }
    .title-card h2 { margin: 0 0 10px; font-size: calc(22px * var(--text-scale)); }
    .logo { text-align: center; font-size: calc(46px * var(--text-scale)); font-weight: 800; letter-spacing: 10px; color: var(--accent); padding-left: 10px; }
    .tagline { text-align: center; color: #b8c4d0; margin-bottom: 18px; font-weight: 500; }
    .title-card .primary.hero { letter-spacing: 0; font-size: calc(18px * var(--text-scale)); min-height: 60px; flex-direction: column; gap: 0; }
    .title-card small { display: block; font-weight: 500; font-size: calc(12px * var(--text-scale)); opacity: 0.8; margin-top: 2px; }
    .title-card .choice, .title-card .primary, .title-card .secondary { justify-content: center; text-align: center; }
    .title-card .choice { min-height: 56px; }
    .title-card .choice > span { display: block; width: 100%; text-align: center; }
    .title-card small { text-align: center; }
    .credit { text-align: center; margin-top: 14px; font-size: calc(11px * var(--text-scale)); color: #7f90a0; }
    .scenario-list { display: grid; gap: 8px; margin-bottom: 8px; max-height: 66vh; overflow-y: auto; }
    .scenario {
      display: grid;
      gap: 4px;
      text-align: left;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--chip-bg);
      border: 1px solid var(--bar-border);
      box-sizing: border-box;
    }
    .scenario.locked { opacity: 0.5; }
    .sc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sc-blurb { color: #c8d2dc; font-weight: 500; font-size: calc(13px * var(--text-scale)); }
    .sc-goals { color: #9fb0c0; font-weight: 500; font-size: calc(12px * var(--text-scale)); line-height: 1.4; }
    .medal { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: calc(12px * var(--text-scale)); font-weight: 700; color: #1d2733; letter-spacing: 0; }
    .medal.gold { background: #ffd166; }
    .medal.silver { background: #d5dde6; }
    .medal.bronze { background: #d99a63; }
    h2.big .medal { font-size: calc(18px * var(--text-scale)); padding: 4px 18px; }
    #hud-goal { border: 0; color: var(--accent); white-space: nowrap; }
    #hud-goal.done { color: #7be0a0; }
    /* In Career the Layers button shrinks to its icon so the Goals pill fits on a phone. */
    .hud3.career .overlay-btn:not(.active) span { display: none; }

    /* ---- Tutorial card, tenant story card, frame rate, animation touches ---- */
    .tutorial {
      position: absolute;
      top: calc(max(8px, env(safe-area-inset-top)) + 166px);
      left: 8px;
      right: 8px;
      background: rgba(22, 32, 44, 0.97);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 10px 12px;
      pointer-events: auto;
      z-index: 5;
    }
    .tutorial[hidden] { display: none; }
    .tutorial-count { font-size: calc(11px * var(--text-scale)); color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
    .tutorial-text { margin: 4px 0 8px; line-height: 1.4; font-weight: 500; }
    .tutorial-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .tutorial-actions .primary, .tutorial-actions .secondary { width: auto; margin-top: 0; padding: 0 16px; min-height: 44px; }
    .tutorial-pulse { animation: pulse 1s ease-in-out infinite; position: relative; z-index: 4; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.9); }
      50% { box-shadow: 0 0 0 9px rgba(255, 209, 102, 0); }
    }
    .story-card {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: calc(var(--toolbar-h, 200px) + 8px);
      background: rgba(22, 32, 44, 0.97);
      border: 1px solid var(--bar-border);
      border-radius: 16px;
      padding: 10px 12px;
      pointer-events: auto;
      animation: slide-up 0.18s ease-out;
    }
    .story-card[hidden] { display: none; }
    #ui-root.story-open .legend { display: none; }
    .story-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .story-name { font-size: calc(17px * var(--text-scale)); font-weight: 700; }
    .story-job { color: #9fb0c0; font-weight: 500; }
    .story-status { margin: 6px 0; font-size: calc(15px * var(--text-scale)); color: var(--accent); }
    .story-mood { display: flex; align-items: center; gap: 10px; font-weight: 500; margin-bottom: 4px; }
    .story-mood .bar { flex: 1; height: 8px; border-radius: 4px; background: #2b3a4a; overflow: hidden; }
    .story-mood .bar span { display: block; height: 100%; background: linear-gradient(90deg, #f7b267, #8e1d4c); }
    .story-trait { font-weight: 500; color: #c8d2dc; line-height: 1.35; margin-bottom: 4px; }
    .story-trait .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .story-card .secondary { margin-top: 4px; min-height: 44px; }
    @keyframes slide-up { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet:not([hidden]) { animation: slide-up 0.2s ease-out; }
    .fps {
      position: fixed;
      left: 6px;
      bottom: 4px;
      font: 600 11px system-ui, sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      padding: 2px 6px;
      pointer-events: none;
      z-index: 20;
    }
    .fps[hidden] { display: none; }
    #hud-funds.bump { animation: bump 0.35s ease-out; }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
    button:active:not(:disabled) { transform: scale(0.97); }
    .center { text-align: center; justify-content: center; }
    .big { font-size: calc(30px * var(--text-scale)); letter-spacing: 4px; color: var(--accent); }
    .unlock-list { line-height: 1.6; }
    .notes { margin: 0 0 10px; padding-left: 18px; color: #c8d2dc; font-weight: 500; line-height: 1.5; }
    .row.check.ok { color: #7be0a0; }
    .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 20px; }
    .confetti i {
      position: absolute;
      top: -14px;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      animation: confetti-fall linear infinite;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(520px) rotate(540deg); opacity: 0.2; }
    }

    /* ---- Alerts (fires, inspector news...) ---- */
    .alerts {
      position: absolute;
      top: calc(max(8px, env(safe-area-inset-top)) + 238px);
      left: 8px;
      right: 8px;
      display: grid;
      gap: 6px;
      pointer-events: none;
    }
    .alert {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(29, 39, 51, 0.96);
      border-left: 6px solid var(--accent);
      border-radius: 12px;
      padding: 8px 8px 8px 12px;
      font-size: calc(13px * var(--text-scale));
      line-height: 1.3;
    }
    .alert.fire { border-color: #ef5b3c; }
    .alert.power { border-color: #f2c14e; }
    .alert.pests { border-color: #8bc34a; }
    .alert.good { border-color: #4caf7d; }
    .alert .msg { flex: 1; }
    .alert button { min-height: 44px; min-width: 44px; border-radius: 10px; background: var(--chip-bg); padding: 0 10px; }

    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(var(--toolbar-h, 200px) + 12px);
      transform: translateX(-50%);
      background: rgba(20, 28, 38, 0.95);
      border-radius: 20px;
      padding: 10px 18px;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    .toolbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bar-bg);
      border-top: 1px solid var(--bar-border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tb-handle {
      position: absolute;
      right: 10px;
      top: -34px;
      min-width: 64px;
      height: 34px;
      padding: 0 14px;
      border-radius: 14px 14px 0 0;
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      border-bottom: 0;
      color: #b8c4d0;
      font-size: calc(13px * var(--text-scale));
      font-weight: 600;
    }
    .toolbar.collapsed .hint, .toolbar.collapsed .tabs, .toolbar.collapsed .items { display: none; }
    .toolbar.collapsed { border-top: 0; }
    .hint {
      padding: 6px 12px 0;
      font-size: calc(12px * var(--text-scale));
      font-weight: 500;
      color: #b8c4d0;
      min-height: 1.3em;
    }
    .tabs, .items {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 8px;
      scrollbar-width: none;
      touch-action: pan-x; /* these rows scroll sideways with a finger */
    }
    .tabs::-webkit-scrollbar, .items::-webkit-scrollbar { display: none; }
    button {
      font: inherit;
      color: inherit;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .tab {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 22px;
      background: transparent;
      color: #b8c4d0;
    }
    .tab.active { background: var(--chip-bg); color: #fff; border-color: var(--accent); }
    .item {
      flex: 0 0 auto;
      min-width: 96px;
      min-height: 76px;
      padding: 6px 10px;
      border-radius: 14px;
      background: var(--chip-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .item.active { border-color: var(--accent); background: #3a4c60; }
    /* Star-rating dividers in the build lists */
    .star-label { flex: 0 0 auto; align-self: stretch; min-width: 62px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; padding: 0 8px; border-left: 2px dashed #5b6b7b; color: var(--accent); }
    .star-label:first-child { border-left: 0; }
    .star-label .stars { font-size: calc(13px * var(--text-scale)); letter-spacing: 1px; }
    .star-label .tier { font-size: calc(11px * var(--text-scale)); color: #b8c4d0; text-align: center; }
    .star-label.locked { opacity: 0.65; }
    /* Needs tab cards */
    .item.need { align-items: flex-start; text-align: left; min-width: 170px; max-width: 220px; gap: 2px; border-left: 5px solid #5aa9e6; }
    .item.need.sev3 { border-left-color: #e0503c; }
    .item.need.sev2 { border-left-color: #f0a830; }
    .item.need .tag { font-size: calc(10.5px * var(--text-scale)); font-weight: 800; letter-spacing: 0.6px; color: #9fb0c0; }
    .item.need.sev3 .tag { color: #ff9a8a; }
    .item.need.sev2 .tag { color: #ffd08a; }
    .item.need .t { font-size: calc(13px * var(--text-scale)); font-weight: 700; line-height: 1.2; }
    .item.need .d { font-size: calc(11.5px * var(--text-scale)); color: #b8c4d0; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item.need.none { border-left-color: #4fa36a; }
    .tab .badge { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 6px; border-radius: 10px; background: #e0503c; color: #fff; font-size: 12px; font-weight: 800; line-height: 18px; }
    .tab .badge.amber { background: #e29a1f; color: #1d2733; }
    .item .name { font-size: calc(13px * var(--text-scale)); }
    .item .cost { font-size: calc(12px * var(--text-scale)); color: var(--accent); }
    /* Unaffordable: dimmed AND the price gets a strike line (not color only). */
    .item.poor { opacity: 0.6; }
    .item.poor .cost { text-decoration: line-through; }
    .item.locked { opacity: 0.55; border: 2px dashed #5b6b7b; }
    .item.locked .swatch { filter: grayscale(0.8); }
    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 3px solid;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.65);
    }
  </style>
</head>

  <script type="module" src="./src/main.js"></script>
